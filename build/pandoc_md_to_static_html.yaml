reader: markdown
writer: html
embed-resources: false
variables:
  document-css: false
filters:
  - citeproc
top-level-division: chapter
wrap: none
columns: 78
dpi: 72
toc: false
toc-depth: 2
number-sections: false
section-divs: true
identifier-prefix: ""
title-prefix: ""
eol: lf
strip-comments: false
ascii: false
default-image-extension: .jpg
tab-stop: 4
preserve-tabs: false
html-q-tags: false
fail-if-warnings: false
